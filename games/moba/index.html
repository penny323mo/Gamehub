<!DOCTYPE html>
<html lang="zh-HK">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>深淵之橋 — 三對三 MOBA</title>
    <!-- 內嵌 icon：唔擺嘅話瀏覽器會自己去攞 /favicon.ico，靜態寄存下面實 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1220'/%3E%3Cpath d='M9 24l14-14M9 24l-1-4 3-1M23 10l1-4-4 1' stroke='%23f2c85b' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css?v=portrait-lane-6">
    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three.module.min.js"
        }
    }
    </script>
</head>

<body>
    <div id="stage">
        <canvas id="gl"></canvas>

        <div id="hud" class="hidden"></div>

        <div id="loading">
            <h1>深淵之橋</h1>
            <p class="sub">一條橋、三對三、一個水晶</p>
            <div class="load-track"><i id="load-bar"></i></div>
            <p id="load-label">載入資產…</p>
        </div>

        <div id="select" class="hidden">
            <h2>揀你嘅英雄</h2>
            <div id="pick-grid"></div>
            <button id="pick-go">開打</button>
            <p class="hint">
                電腦：<b>WASD</b> 走位　<b>空白鍵</b>普攻　<b>Q F E R</b> 技能（撳住睇範圍）<br>
                <b>X</b> 返程　<b>B</b> 商店　滾輪縮放<br>
                手機：左邊拖動走位　右邊撳普攻　技能掣撳住拖出去瞄準再放手　雙指縮放
            </p>
        </div>

        <div id="result" class="hidden">
            <h2></h2>
            <p class="detail"></p>
            <div class="sheet"></div>
            <button>再嚟一場</button>
        </div>
    </div>

    <script type="module" src="./src/main.js?v=portrait-lane-6"></script>
</body>

</html>
