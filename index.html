<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23020617'/%3E%3Cpath d='M16 23h32v18H16z' fill='%2322d3ee'/%3E%3Ccircle cx='24' cy='32' r='4' fill='%23020617'/%3E%3Ccircle cx='40' cy='29' r='2' fill='%23020617'/%3E%3Ccircle cx='44' cy='34' r='2' fill='%23020617'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="switch-container">
        <!-- Main Game Hub -->
        <div id="app-hub">
            <header class="hub-header">
                <h1>Game Hub</h1>
                <div class="hub-subnote">vibe coding by penny323</div>
            </header>
            <div class="carousel-container" aria-roledescription="carousel" aria-label="Game Hub 遊戲庫">
                <div class="carousel-track-container" aria-live="polite">
                    <ul class="carousel-track" id="game-carousel">
                        <!-- Items injected by JS -->
                    </ul>
                </div>
                <div class="carousel-footer">
                    <button class="nav-btn prev-btn" type="button" onclick="prevGame()" aria-label="上一組遊戲">&#10094;</button>
                    <div class="carousel-dots" id="carousel-dots" aria-label="遊戲分頁"></div>
                    <span class="carousel-status" id="carousel-status"></span>
                    <button class="nav-btn next-btn" type="button" onclick="nextGame()" aria-label="下一組遊戲">&#10095;</button>
                </div>
            </div>
        </div>
    </div>
    <script src="launcher.js"></script>
</body>

</html>
