name: Build and deploy Game Hub to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            games/tower/package-lock.json
            games/ashen-rail/package-lock.json
            games/elden-ring-ii/package-lock.json
            games/snake-game/package-lock.json
            games/xiangqi-ai/package-lock.json
            games/royale/tests/package-lock.json
            games/Racing Car/tests/package-lock.json

      - name: Validate catalog and ReleaseGate contracts
        run: |
          node scripts/build-game-catalog.mjs --check
          node tests/catalog.mjs
          node scripts/build-asset-census.mjs --check
          node tests/asset-catalog.mjs
          node tests/asset-census.mjs
          node tests/release-gate.mjs

      - name: Install Tower Defense dependencies
        working-directory: games/tower
        run: npm ci

      - name: Install Tower Defense browser
        working-directory: games/tower
        run: npx playwright install --with-deps chromium

      - name: Run required changed-game release matrix
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BASE="$EVENT_BEFORE"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/install-release-deps.mjs --all --skip games/tower
            node scripts/release-gate.mjs --all --tier full --run
            exit 0
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/install-release-deps.mjs --all --skip games/tower
            node scripts/release-gate.mjs --all --tier full --run
            exit 0
          fi
          node scripts/install-release-deps.mjs --base "$BASE" --head HEAD --skip games/tower
          node scripts/release-gate.mjs --base "$BASE" --head HEAD --tier full --run

      - name: Run required 13-game Hub fast gates
        run: |
          node tests/hub.mjs
          node tests/hub-themes.mjs
          node tests/hub-load.mjs
          node tests/hub-touch.mjs
          node tests/hub-storage.mjs
          node tests/hub-home.mjs

      - name: Generate Game Hub build info
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_TIME=$(TZ='Asia/Hong_Kong' date -d "@$(git log -1 --format=%ct)" +'%Y-%m-%d %H:%M:%S +0800')
          BUILD_TIME=$(TZ='Asia/Hong_Kong' date +'%Y-%m-%d %H:%M:%S +0800')
          cat > games/gomoku/build_info.js << EOF
          window.__BUILD__ = { commit: "${COMMIT_SHA}", commitTime: "${COMMIT_TIME}", buildTime: "${BUILD_TIME}" };
          EOF
          sed -i "s/?v=[a-z0-9]\{7\}/?v=${COMMIT_SHA}/g" games/gomoku/index.html games/gomoku/gomoku.css games/royale/index.html || true

      - name: Stage static site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='output' --exclude='test-results' --exclude='_site' ./ _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
